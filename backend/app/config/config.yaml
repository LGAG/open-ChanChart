redis:
  url: redis://localhost:6379
  host: localhost
  port: 6379
  password: your_redis_pwd
  db: 0
mysql:
  host: localhost
  port: 3306
  user: root
  password: root
  database: chan

# baostock 数据源限流配置（全量更新股票数据时控制请求速率，避免被封IP）
# - qps_interval: 两次 query 之间的间隔(秒)，约 3 req/s（baostock 免费数据源经验值）
# - max_retries: 单次查询失败最大重试次数
# - retry_base_delay: 重试退避起始间隔(秒)，每次翻倍（如 1/2/4）
baostock:
  qps_interval: 0.3
  max_retries: 3
  retry_base_delay: 1.0

# 周期映射：将前端/API传入的不规范周期名称映射为baostock所需的频率值
# baostock支持的频率值：d=日K, w=周K, m=月K, 5=5分钟, 15=15分钟, 30=30分钟, 60=60分钟
period_map:
  # 日K
  day: d
  daily: d
  d: d
  # 60分钟K
  60f: "60"
  "60": "60"
  hour: "60"
  # 30分钟K
  30f: "30"
  "30": "30"
  half: "30"
  # 15分钟K
  15f: "15"
  "15": "15"
  # 5分钟K
  5f: "5"
  "5": "5"
  five_min: "5"
  # 周K
  week: w
  w: w
  # 月K
  month: m
  m: m

# 缠论算法配置
chan:
  # 中枢识别算法选择：
  # - seg_pen : 段内笔中枢（默认，3笔区间 + 不跨段，见 zhongshu.md §3）
  # - v2      : 第二种中枢算法（待设计，选择后将抛 NotImplementedError）
  zhongshu_algo: seg_pen
  # T1背驰阈值：趋势末端最后离开笔力度 / 前同向离开笔力度 < 此值才判背驰（见 buy_sell_points.md §3.1）。
  # <1 即力度衰减；0.8 = 衰减20%以上才出信号，值越小越严格、信号越少但越可靠。可对照实盘调参。
  divergence_ratio: 0.8